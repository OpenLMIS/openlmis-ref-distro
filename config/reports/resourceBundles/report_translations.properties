# Example of a deployment-specific override for the report translations.
#
# The base translations are Transifex-managed and ship inside the openlmis-report jar.
# This directory is merged on top of them, per locale, and only where a value actually
# DIFFERS from the shipped English source - a value identical to the source is discarded
# as a leftover copy of the base bundle. Put a locale's own wording in
# report_translations_<lang>.properties; this file applies to every locale that has no
# file of its own.
#
# Keep this directory minimal. A full copy of the base bundle taken from an older release
# does differ from today's source, so it IS applied, and it then masks the current
# translations for every locale - including locales it does not even contain, because
# ResourceBundle falls back to this file when there is no file for the locale.
#
# The service logs what this directory did, per locale, on the first report generated
# after a restart: "applied N key(s)" and "ignored N key(s)". Both numbers should be
# small and deliberate.
#
# The two keys below are the reference distribution's own header wording. They are
# byte-identical to the shipped source on purpose, so this example is inert and the
# service logs "ignored 2 key(s)" - they are here to show the file's shape, not to
# change anything.

### GLOBAL HEADERS
report.globalHeader.subtitle=OpenLMIS Report
report.globalHeader.title=OpenLMIS
